name: CI — Quality, Security, Contract, TypeScript & MariaDB Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static Analysis, Security, OpenAPI 3.1 & MariaDB 11.4 Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root_ci_password
          MARIADB_DATABASE: crowdfunding
          MARIADB_USER: crowdfunding
          MARIADB_PASSWORD: crowdfunding
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql://crowdfunding:crowdfunding@127.0.0.1:3306/crowdfunding
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grant test database privileges to MariaDB CI user
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'crowdfunding'@'%'; FLUSH PRIVILEGES;"

      - name: Install MariaDB client development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config build-essential

      - name: Set up Python 3.12 & uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Node.js 20 for frontend type checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff formatting check
        run: uv run ruff format --check src scripts deploy/cpanel/passenger_wsgi.py

      - name: Ruff lint & security rules
        run: uv run ruff check src scripts deploy/cpanel/passenger_wsgi.py

      - name: Strict Mypy type checking
        run: uv run mypy

      - name: TypeScript strict check of the frontend handoff kit
        run: npx --yes --package typescript@5.9.3 tsc --noEmit -p docs/frontend/tsconfig.json

      - name: Bandit SAST scan
        run: uv run bandit -c pyproject.toml -r src

      - name: Dependency CVE audit (pip-audit)
        run: uv run pip-audit

      - name: Verify zero uncommitted migration drift
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          uv run python src/manage.py migrate --noinput
          uv run python src/manage.py createcachetable --database=cache
          uv run python src/manage.py makemigrations --check --dry-run

      - name: Validate production deployment security settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: "ci-production-check-only-ephemeral-64-char-random-key-0123456789abcd"
          FIELD_ENCRYPTION_KEY: "ci-field-enc-ephemeral-key-32-chars-minimum"
          PII_BLIND_INDEX_KEY: "ci-blind-index-ephemeral-key-32-chars-min"
          AUDIT_ANCHOR_HMAC_KEY: "ci-audit-anchor-ephemeral-key-32-chars-min"
          PAYMENT_DEFAULT_GATEWAY: "zarinpal"
          ZARINPAL_MERCHANT_ID: "00000000-0000-0000-0000-000000000000"
          CORS_ALLOWED_ORIGINS: "https://charity.example.org"
        run: uv run python src/manage.py check --deploy --fail-level ERROR

      - name: Validate OpenAPI 3.1 contract (zero warnings & zero schema drift)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          # تعریف «هم‌گام» = معنای یکی، نه بایت‌های یکی.
          # scripts/verify_contract_sync.py نمونه‌ها را کنار می‌گذارد و درخت
          # داده را مقایسه می‌کند؛ diff متنی خام به‌خاطر عرض متفاوت شکستن
          # متن‌های فارسی، CI v1.5.0 را بی‌دلیل قرمز کرد.
          uv run python scripts/verify_contract_sync.py

      - name: Verify frontend handoff kit is in sync with the contract
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          uv run python scripts/build_frontend_kit.py
          git diff --exit-code -- docs/frontend docs/api/v1/openapi.yaml

      - name: Run Pytest suite with >= 85% branch coverage on MariaDB
        run: uv run pytest --cov=apps --cov-branch --cov-report=term-missing --cov-fail-under=85
