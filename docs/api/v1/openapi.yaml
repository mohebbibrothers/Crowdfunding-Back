      type: object
      description: ورودی ساخت لینک سفیر اجتماعی برای حرکت یا قلک.
      properties:
        campaign_id:
          type:
          - string
          - 'null'
          format: uuid
        charity_jar_id:
          type:
          - string
          - 'null'
          format: uuid
        custom_note:
          type: string
          default: ''
          maxLength: 240
