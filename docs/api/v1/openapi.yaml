components:
  schemas:
    AdminPayment:
      type: object
      description: نمای مدیریتی پرداخت با پوشاندن شماره موبایل خیر به صورت پیش‌فرض.
      properties:
        id:
          type: string
          format: uuid
        contribution_id:
          type: string
          format: uuid
        gateway_name:
          type: string
        authority:
          type: string
        ref_id:
          type: string
        status:
          type: string
        amount_rial:
          type: integer
        amount_toman:
          type: integer
          readOnly: true
        donor_phone_masked:
          type: string
          readOnly: true
        donor_user_id:
          type: string
          format: uuid
        benefactor_name:
          type: string
        target_title:
          type: string
          readOnly: true
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - amount_rial
      - amount_toman
      - authority
      - benefactor_name
      - contribution_id
      - created_at
      - donor_phone_masked
      - donor_user_id
      - gateway_name
      - id
      - ref_id
      - status
      - target_title
      - verified_at
