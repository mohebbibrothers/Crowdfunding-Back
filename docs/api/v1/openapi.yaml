          type: string
          minLength: 5
          maxLength: 400
      required:
      - reason
      - role
    AdminUserOutput:
      type: object
      description: نمای کاربر برای میز عملیاتی ادمین (با شماره تلفن پوشانده در حالت
        عادی).
      properties:
        id:
          type: string
          format: uuid
        masked_phone:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        province:
          type: string
        city:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - city
      - created_at
      - display_name
      - first_name
      - id
      - is_active
      - last_name
      - masked_phone
      - province
      - role
