      properties:
        id:
          type: string
          format: uuid
        contribution_id:
          type: string
          format: uuid
        gateway_name:
          type: string
        authority:
          type: string
        ref_id:
          type: string
        status:
          type: string
        amount_rial:
          type: integer
        amount_toman:
          type: integer
          readOnly: true
        donor_phone_masked:
          type: string
          readOnly: true
        donor_user_id:
          type: string
          format: uuid
        benefactor_name:
          type: string
        target_title:
          type: string
          readOnly: true
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - amount_rial
      - amount_toman
      - authority
      - benefactor_name
      - contribution_id
      - created_at
      - donor_phone_masked
      - donor_user_id
      - gateway_name
      - id
      - ref_id
      - status
      - target_title
      - verified_at
    AdminPhoneRevealInputRequest:
      type: object
      description: ورودی درخواست مشاهدهٔ شمارهٔ کامل خیر با الزام ثبت هدف.
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 400
      required:
      - reason
    AdminRoleChangeInputRequest:
      type: object
      description: ورودی تغییر نقش کاربری با الزام دلیل.
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        reason:
          type: string
          minLength: 5
          maxLength: 400
      required:
      - reason
      - role
    AdminUserOutput:
      type: object
      description: نمای کاربر برای میز عملیاتی ادمین (با شماره تلفن پوشانده در حالت
        عادی).
      properties:
        id:
          type: string
          format: uuid
        masked_phone:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        province:
          type: string
        city:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
