  description: کارنامهٔ معنوی خیر، تاریخچهٔ مشارکت‌ها و اثبات مرکل شخصی.
- name: Public - Benefactors & Jars
  description: کاتالوگ عمومی خیریه‌ها (مددکاران) و قلک‌های عام.
