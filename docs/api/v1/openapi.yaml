      description: نمای تاریخچهٔ خروجی‌های اکسل صادرشده.
      properties:
        id:
          type: string
          format: uuid
        exported_by_id:
          type: string
          format: uuid
        filters: {}
        include_raw_phones:
          type: boolean
        reason:
          type: string
        file_sha256:
          type: string
        byte_size:
          type: integer
        row_counts: {}
        created_at:
          type: string
          format: date-time
      required:
      - byte_size
      - created_at
      - exported_by_id
      - file_sha256
      - filters
      - id
      - include_raw_phones
      - reason
      - row_counts
    RoleEnum:
      enum:
      - donor
      - operator
      - finance_manager
      - super_admin
      type: string
      description: |-
        * `donor` - نیکوکار (کاربر عادی)
        * `operator` - کارشناس عملیات
        * `finance_manager` - مدیر مالی و ممیزی
        * `super_admin` - مدیر ارشد سامانه
    SessionItemOutput:
      type: object
      description: نمای یک نشست فعال در فهرست دستگاه‌های کاربر.
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
        network:
          type: string
        mfa_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_current:
          type: boolean
      required:
      - created_at
      - device
      - id
      - is_current
      - last_seen_at
      - mfa_verified
      - network
    ShortLinkResolveResponse:
      type: object
      description: پاسخ حل‌کنندهٔ پیوندک کوتاه.
      properties:
        kind:
          type: string
        short_code:
          type: string
        slug:
          type: string
        title:
          type: string
        target_path:
          type: string
        ambassador_code:
          type:
          - string
          - 'null'
      required:
      - kind
      - short_code
      - slug
      - target_path
      - title
    StaffPasswordLoginInputRequest:
      type: object
      description: ورودی ورود کارکنان با گذرواژه.
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - phone
    TargetKindEnum:
      enum:
      - campaign_shares
      - charity_jar
      type: string
      description: |-
        * `campaign_shares` - خرید سهم از حرکت خیرخواهانه
        * `charity_jar` - واریز آزاد به قلک عام خیریه
    TokenRefreshInputRequest:
      type: object
      description: ورودی نوسازی چرخشی توکن دسترسی.
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
    UrgencyLevelEnum:
      enum:
      - normal
      - urgent
      - emergency
      type: string
      description: |-
        * `normal` - عادی
        * `urgent` - فوری
        * `emergency` - اضطراری / حیاتی
    UserMeOutput:
      type: object
      description: نمای پروفایل کاربر جاری.
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        national_code_masked:
          type: string
          description: نمایش پوشاندهٔ کد ملی.
          readOnly: true
        province:
          type: string
        city:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_profile_complete:
          type: boolean
        is_staff_member:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_at_jalali:
          type:
          - string
          - 'null'
          description: تاریخ عضویت به شمسی.
          readOnly: true
      required:
      - city
      - created_at
      - created_at_jalali
      - display_name
      - first_name
      - id
      - is_profile_complete
      - is_staff_member
      - last_name
      - national_code_masked
      - phone
      - province
      - role
    UserNotification:
      type: object
      description: نمای خروجی یک اعلان کاربر.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        action_url:
          type: string
        metadata: {}
        is_read:
          type: boolean
          description: آیا اعلان خوانده شده است؟
          readOnly: true
        read_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        created_at_jalali:
          type:
          - string
          - 'null'
          description: تاریخ شمسی ثبت اعلان.
          readOnly: true
      required:
      - action_url
      - body
      - created_at
      - created_at_jalali
      - id
      - is_read
      - kind
      - metadata
      - read_at
      - title
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: توکن دسترسی SessionAwareJWT با قابلیت ابطال آنی نشست.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: نشست کوکی HttpOnly هم‌مبدأ همراه با هدر X-CSRFToken در درخواست‌های
        نوشتنی.
