      type: object
      description: خلاصهٔ اثر یک لینک سفیر اجتماعی.
      properties:
        code:
          type: string
        target_title:
          type: string
        click_count:
          type: integer
        referred_donors_count:
          type: integer
        attributed_shares:
          type: integer
        attributed_amount_rial:
          type: integer
        attributed_amount_toman:
