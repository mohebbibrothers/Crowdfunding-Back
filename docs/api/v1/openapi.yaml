components:
  schemas:
    AdminPayment:
      type: object
      description: نمای مدیریتی پرداخت با پوشاندن شماره موبایل خیر به صورت پیش‌فرض.
      properties:
        id:
          type: string
          format: uuid
        contribution_id:
          type: string
          format: uuid
        gateway_name:
          type: string
        authority:
          type: string
        ref_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        amount_rial:
          type: integer
        amount_toman:
          type: integer
          readOnly: true
        donor_phone_masked:
          type: string
          readOnly: true
        donor_user_id:
          type: string
          format: uuid
        benefactor_name:
          type: string
        target_title:
          type: string
          readOnly: true
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - amount_rial
      - amount_toman
      - authority
      - benefactor_name
      - contribution_id
      - created_at
      - donor_phone_masked
      - donor_user_id
      - gateway_name
      - id
      - ref_id
      - status
      - target_title
      - verified_at
    AdminPhoneRevealInputRequest:
      type: object
      description: ورودی درخواست مشاهدهٔ شمارهٔ کامل خیر با الزام ثبت هدف.
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 400
      required:
      - reason
    AdminPledge:
      type: object
      description: ردیف تعهد در پنل مدیریت — با هویت خیر (ماسک‌شدهٔ امن).
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_phone_masked:
          type: string
        status:
          $ref: '#/components/schemas/PledgeStatusEnum'
        target_kind:
          $ref: '#/components/schemas/ContributionTargetKindEnum'
        target_title:
          type: string
        amount_rial:
          type: integer
        amount_toman:
          type: integer
        frequency:
          $ref: '#/components/schemas/PledgeFrequencyEnum'
        next_due_date:
          type: string
          format: date
        total_paid_rial:
          type: integer
        installments_paid:
          type: integer
        consecutive_failures:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - amount_rial
      - amount_toman
      - consecutive_failures
      - created_at
      - frequency
      - id
      - installments_paid
      - next_due_date
      - status
      - target_kind
      - target_title
      - total_paid_rial
      - user_id
      - user_phone_masked
    AdminRoleChangeInputRequest:
      type: object
      description: ورودی تغییر نقش کاربری با الزام دلیل.
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        reason:
          type: string
          minLength: 5
          maxLength: 400
      required:
      - reason
      - role
    AdminUserOutput:
      type: object
      description: نمای کاربر برای میز عملیاتی ادمین (با شماره تلفن پوشانده در حالت عادی).
      properties:
        id:
          type: string
          format: uuid
        masked_phone:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        province:
          type: string
        city:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - city
      - created_at
      - display_name
      - first_name
      - id
      - is_active
