openapi: 3.1.0
info:
  title: Crowdfunding-Back API — سامانه کرادفاندینگ خیرخواهانه سهم‌محور
  version: 1.1.0 (v1)
  description: سرویس بک‌اند ماژولار، حسابداری دوطرفه ریالی، شفافیت رمزنگاری درخت مرکل، مشارکت سریع ۳۰ ثانیه‌ای، نیت‌نامه معنوی، قلک عام، حامی مضاعف و گزارش اکسل ۸ کاربرگه.
paths:
  /api/v1/admin/audit/logs:
