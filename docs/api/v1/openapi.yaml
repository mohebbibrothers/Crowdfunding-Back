openapi: 3.1.0
info:
  title: Crowdfunding-Back API — سامانه کرادفاندینگ خیرخواهانه سهم‌محور
  version: 1.0.0 (v1)
  description: سرویس بک‌اند ماژولار، حسابداری دوطرفه ریالی، شفافیت رمزنگاری درخت مرکل،
    مشارکت سریع ۳۰ ثانیه‌ای، نیت‌نامه معنوی، قلک عام، حامی مضاعف و گزارش اکسل ۸ کاربرگه.
paths:
  /api/v1/admin/audit/logs:
    get:
      operationId: v1_admin_audit_logs_list
      description: واکشی رکوردهای حسابرسی از سلکتور.
      summary: فهرست رکوردهای زنجیرهٔ حسابرسی با فیلتر کنش و هدف
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - Admin - Audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditRecord'
          description: ''
  /api/v1/admin/audit/verify:
    get:
      operationId: v1_admin_audit_verify
      description: راستی‌آزمایی زنجیرهٔ هش و لنگرها.
      summary: بررسی سلامت زنجیرهٔ هش حسابرسی و لنگرهای امضاشده
      tags:
      - Admin - Audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
          description: ''
  /api/v1/admin/auth/risk-signals:
    get:
      operationId: v1_admin_auth_risks_list
      description: واکشی صفحه‌بندی‌شدهٔ سیگنال‌های ریسک.
      summary: فهرست سیگنال‌های ریسک امنیتی ورود و توکن‌ها
      parameters:
      - in: query
        name: status
        schema:
          type: string
      tags:
      - Admin - Identity
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthRiskSignalOutput'
          description: ''
  /api/v1/admin/auth/risk-signals/{signal_id}/review:
    post:
      operationId: v1_admin_auth_risks_review
      description: ذخیرهٔ وضعیت بررسی سیگنال.
      summary: بررسی و تعیین وضعیت سیگنال ریسک احراز هویت
      parameters:
      - in: path
        name: signal_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRiskReviewInputRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRiskSignalOutput'
          description: ''
  /api/v1/admin/benefactors:
    get:
      operationId: v1_admin_benefactors_list
      description: فهرست کامل و ایجاد خیریه/نهاد توسط مدیر سامانه.
      summary: فهرست مدیریتی تمام خیریه‌ها
      tags:
      - Admin - Benefactors & Jars
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenefactorAdmin'
          description: ''
    post:
      operationId: v1_admin_benefactors_create
      description: فهرست کامل و ایجاد خیریه/نهاد توسط مدیر سامانه.
      summary: ایجاد خیریه/نهاد نیکوکاری جدید
      tags:
      - Admin - Benefactors & Jars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefactorWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefactorAdmin'
          description: ''
  /api/v1/admin/benefactors/{benefactor_id}:
    get:
      operationId: v1_admin_benefactors_retrieve
      description: مشاهده، ویرایش و غیرفعال‌سازی/حذف خیریه توسط مدیر.
      summary: دریافت مشخصات کامل مدیریتی خیریه
      parameters:
      - in: path
        name: benefactor_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Benefactors & Jars
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefactorAdmin'
          description: ''
    patch:
      operationId: v1_admin_benefactors_partial_update
      description: مشاهده، ویرایش و غیرفعال‌سازی/حذف خیریه توسط مدیر.
      summary: ویرایش جزئی مشخصات خیریه
      parameters:
      - in: path
        name: benefactor_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Benefactors & Jars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBenefactorPatchRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefactorAdmin'
          description: ''
    delete:
      operationId: v1_admin_benefactors_destroy
      description: مشاهده، ویرایش و غیرفعال‌سازی/حذف خیریه توسط مدیر.
      summary: حذف خیریهٔ بدون سابقه یا غیرفعال‌سازی ایمن آن
      parameters:
      - in: path
        name: benefactor_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Benefactors & Jars
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  deactivated:
                    type: boolean
                  id:
                    type: string
          description: ''
  /api/v1/admin/campaign-categories:
    post:
      operationId: v1_admin_campaign_categories_create
      description: ایجاد دسته‌بندی موضوعی جدید برای حرکت‌ها.
      summary: ایجاد دسته‌بندی موضوعی حرکت
      tags:
      - Admin - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCategoryWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCategory'
          description: ''
  /api/v1/admin/campaigns:
    get:
      operationId: v1_admin_campaigns_list
      description: فهرست کامل مدیریتی و تعریف حرکت سهم‌محور جدید.
      summary: فهرست مدیریتی همهٔ حرکت‌ها
      tags:
      - Admin - Campaigns
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignDetail'
          description: ''
    post:
      operationId: v1_admin_campaigns_create
      description: فهرست کامل مدیریتی و تعریف حرکت سهم‌محور جدید.
      summary: تعریف حرکت خیرخواهانهٔ سهم‌محور جدید
      tags:
      - Admin - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
          description: ''
  /api/v1/admin/campaigns/{campaign_id}:
    get:
      operationId: v1_admin_campaigns_retrieve
      description: دریافت و ویرایش حرکت توسط مدیر (با قفل تغییرناپذیری فیلدهای مالی
        پس از اولین پرداخت).
      summary: دریافت جزئیات مدیریتی یک حرکت
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Campaigns
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
          description: ''
    patch:
      operationId: v1_admin_campaigns_partial_update
      description: دریافت و ویرایش حرکت توسط مدیر (با قفل تغییرناپذیری فیلدهای مالی
        پس از اولین پرداخت).
      summary: ویرایش حرکت (محافظت از قیمت سهم و خیریه پس از اولین مشارکت)
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignPatchRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
          description: ''
  /api/v1/admin/campaigns/{campaign_id}/external-contributions:
    post:
      operationId: v1_admin_campaigns_external_contributions_create
      description: ثبت مشارکت خارج از درگاه آنلاین (آفلاین/فیش بانکی) در حساب انتظامی
        مجزا.
      summary: ثبت سهم‌های تامین‌شده خارج از درگاه آنلاین در حساب انتظامی مجزا
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Payments & Refunds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalContributionWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContribution'
          description: ''
  /api/v1/admin/campaigns/{campaign_id}/impact-updates:
    post:
      operationId: v1_admin_campaigns_impact_updates_create
      description: انتشار گزارش تصویری پیشرفت میدانی حرکت و اطلاع‌رسانی خودکار به
        خیرین.
      summary: انتشار گزارش پیشرفت میدانی حرکت برای سهام‌داران
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpactUpdateWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignImpactUpdate'
          description: ''
  /api/v1/admin/campaigns/{campaign_id}/matching-grants:
    post:
      operationId: v1_admin_campaigns_matching_grants_create
      description: تعریف حامی مضاعف‌کننده (Matching Grant) برای یک حرکت.
      summary: ثبت تعهد حامی مضاعف‌کننده برای حرکت
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingGrantWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingGrantPublic'
          description: ''
  /api/v1/admin/disbursements:
    get:
      operationId: v1_admin_disbursements_list
      description: فهرست درخواست‌های تسویه با خیریه‌ها و ثبت درخواست جدید (Maker).
      summary: فهرست درخواست‌های تسویه با خیریه‌ها
      tags:
      - Admin - Ledger & Disbursements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisbursementRequest'
          description: ''
    post:
      operationId: v1_admin_disbursements_create
      description: فهرست درخواست‌های تسویه با خیریه‌ها و ثبت درخواست جدید (Maker).
      summary: ثبت درخواست تسویه وجه با خیریه (گام Maker)
      tags:
      - Admin - Ledger & Disbursements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementCreateInputRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementRequest'
          description: ''
  /api/v1/admin/disbursements/{disbursement_id}/review:
    post:
      operationId: v1_admin_disbursements_review
      description: تأیید نهایی (به همراه ثبت سند دفترکل) یا رد درخواست تسویه توسط
        مدیر دوم با MFA تازه.
      summary: تأیید یا رد چهارچشمی درخواست تسویه با خیریه (Checker + Step-Up MFA)
      parameters:
      - in: path
        name: disbursement_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Ledger & Disbursements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementReviewInputRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementRequest'
          description: ''
  /api/v1/admin/jars:
    get:
      operationId: v1_admin_jars_list
      description: فهرست و ایجاد قلک عام خیریه در پنل مدیریت.
      summary: فهرست مدیریتی قلک‌های عام خیریه‌ها
      tags:
      - Admin - Benefactors & Jars
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CharityJarPublic'
          description: ''
    post:
      operationId: v1_admin_jars_create
      description: فهرست و ایجاد قلک عام خیریه در پنل مدیریت.
      summary: ایجاد قلک عام جدید برای خیریه
      tags:
      - Admin - Benefactors & Jars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharityJarWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharityJarPublic'
          description: ''
  /api/v1/admin/jars/{jar_id}:
    patch:
      operationId: v1_admin_jars_partial_update
      description: ویرایش جزئیات و فعال/غیرفعال‌سازی قلک عام خیریه.
      summary: ویرایش تنظیمات قلک عام خیریه
      parameters:
      - in: path
        name: jar_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Benefactors & Jars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCharityJarPatchRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharityJarPublic'
          description: ''
  /api/v1/admin/ledger/accounts:
    get:
      operationId: v1_admin_ledger_accounts_list
      description: فهرست سرفصل‌های دفترکل دوطرفه و ماندهٔ هر حساب.
      summary: مشاهدهٔ تراز سرفصل‌های دفترکل حسابداری دوطرفه
      tags:
      - Admin - Ledger & Disbursements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerAccount'
          description: ''
  /api/v1/admin/ledger/control-snapshot:
    post:
      operationId: v1_admin_ledger_control_snapshot_create
      description: ثبت و مشاهدهٔ اسنپ‌شات تراز آزمایشی دفترکل و کنترل انطباق شمارنده‌ها.
      summary: محاسبه و ثبت اسنپ‌شات کنترل تراز دفترکل و انطباق شمارنده‌ها
      tags:
      - Admin - Ledger & Disbursements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialControlSnapshot'
          description: ''
  /api/v1/admin/ledger/entries:
    get:
      operationId: v1_admin_ledger_entries_list
      description: فهرست اسناد روزنامهٔ ثبت‌شده در دفترکل.
      summary: فهرست اسناد روزنامهٔ حسابداری
      tags:
      - Admin - Ledger & Disbursements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntry'
          description: ''
  /api/v1/admin/payments:
    get:
      operationId: v1_admin_payments_list
      description: فهرست مدیریتی پرداخت‌ها (شماره موبایل خیر به صورت پیش‌فرض پوشانده
        است).
      summary: فهرست مدیریتی تراکنش‌های درگاه پرداخت
      tags:
      - Admin - Payments & Refunds
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPayment'
          description: ''
  /api/v1/admin/payments/{payment_id}/refund:
    post:
      operationId: v1_admin_payments_refund
      description: استرداد وجه پرداخت تاییدشده با سند معکوس دفترکل و احراز هویت چندعاملی
        تازه.
      summary: ثبت استرداد وجه پرداخت و آزادسازی سهم‌ها (نیازمند Step-Up MFA)
      parameters:
      - in: path
        name: payment_id
        schema:
          type: string
        required: true
      tags:
      - Admin - Payments & Refunds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRefundInputRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_id:
                    type: string
                  amount_rial:
                    type: integer
                  status:
                    type: string
          description: ''
  /api/v1/admin/policies:
    get:
      operationId: v1_admin_policies_list
      description: بازگرداندن فهرست کامل سیاست‌ها همراه با نسخهٔ فعلی هر قانون.
      summary: مشاهدهٔ فهرست سیاست‌های زمان اجرا و وضعیت کلیدهای قابلیت‌ها
      tags:
      - Admin - Governance
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRuleOutput'
          description: ''
  /api/v1/admin/policies/{policy_key}:
    post:
      operationId: v1_admin_policies_update
      description: اعمال تغییر سیاست و ثبت در زنجیرهٔ حسابرسی.
      summary: تغییر نسخه‌دار یک سیاست سامانه با الزام دلیل و Step-Up MFA
      parameters:
      - in: path
        name: policy_key
        schema:
          type: string
        required: true
      tags:
      - Admin - Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateInputRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleOutput'
          description: ''
  /api/v1/admin/reconciliations:
    get:
      operationId: v1_admin_reconciliations_list
      description: فهرست دسته‌های مغایرت‌گیری درگاه و اجرای مغایرت‌گیری جدید.
      summary: فهرست دسته‌های مغایرت‌گیری درگاه پرداخت
      tags:
      - Admin - Ledger & Disbursements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
