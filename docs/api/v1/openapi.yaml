      operationId: v1_admin_audit_logs_list
      description: واکشی رکوردهای حسابرسی از سلکتور.
      summary: فهرست رکوردهای زنجیرهٔ حسابرسی با فیلتر کنش و هدف
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
        description: مکاننمای رمزگذاریشدهٔ صفحهٔ بعد/قبل (دقیقاً از meta.next/meta.previous بردار).
      - in: query
        name: page_size
        schema:
          type: integer
        description: اندازهٔ صفحه (پیشفرض ۲۰؛ سقف ۵۰ برای جداول ادمین و ۱۰۰ برای سایر فهرستها).
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      - in: header
        name: X-Request-ID
        required: false
        description: شناسهٔ ردیابی دلخواه (۸ تا ۶۴ کاراکتر امن)؛ در غیر این صورت سرور یک UUIDv7 تولید کرده و در همان هدر پاسخ و فیلد trace_id خطاها برمیگرداند.
        schema:
          type: string
      - in: header
        name: If-None-Match
        required: false
        description: ETag ذخیرهشده؛ در صورت عدم تغییر پاسخ 304 Not Modified دریافت میشود.
        schema:
          type: string
      tags:
      - Admin - Audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditRecord'
              examples:
                realistic:
                  summary: نمونهٔ واقعیِ تولیدشده از همین اسکیما
                  description: این مقدار از روی اسکیمای همین پاسخ ساخته و با jsonschema اعتبارسنجی شده است؛ مقادیر بر اساس معنای نام فیلد انتخاب شده‌اند.
