openapi: 3.1.0
info:
  title: Crowdfunding-Back API — سامانه کرادفاندینگ خیرخواهانه سهم‌محور
  version: 1.1.0 (v1)
  description: سرویس بک‌اند ماژولار، حسابداری دوطرفه ریالی، شفافیت رمزنگاری درخت مرکل،
    مشارکت سریع ۳۰ ثانیه‌ای، نیت‌نامه معنوی، قلک عام، حامی مضاعف و گزارش اکسل ۸ کاربرگه.
paths:
  /api/v1/admin/audit/logs:
    get:
      operationId: v1_admin_audit_logs_list
      description: واکشی رکوردهای حسابرسی از سلکتور.
      summary: فهرست رکوردهای زنجیرهٔ حسابرسی با فیلتر کنش و هدف
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
        description: مکاننمای رمزگذاریشدهٔ صفحهٔ بعد/قبل (دقیقاً از meta.next/meta.previous
          بردار).
      - in: query
        name: page_size
        schema:
          type: integer
        description: اندازهٔ صفحه (پیشفرض ۲۰؛ سقف ۵۰ برای جداول ادمین و ۱۰۰ برای سایر
          فهرستها).
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      - in: header
        name: X-Request-ID
        required: false
        description: شناسهٔ ردیابی دلخواه (۸ تا ۶۴ کاراکتر امن)؛ در غیر این صورت سرور
          یک UUIDv7 تولید کرده و در همان هدر پاسخ و فیلد trace_id خطاها برمیگرداند.
        schema:
          type: string
      - in: header
        name: If-None-Match
        required: false
        description: ETag ذخیرهشده؛ در صورت عدم تغییر پاسخ 304 Not Modified دریافت
          میشود.
        schema:
          type: string
      tags:
      - Admin - Audit
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditRecord'
          description: ''
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '405':
          $ref: '#/components/responses/Problem405'
        '409':
          $ref: '#/components/responses/Problem409'
        '410':
          $ref: '#/components/responses/Problem410'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      x-frontend-policy:
        auth: required
        retry: safe
        errorFormat: application/problem+json
        traceHeader: X-Request-ID
        paginated: true
