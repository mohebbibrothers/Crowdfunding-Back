      description: استعلام عمومی اصالت رسید رسمی مشارکت (بدون افشای شماره موبایل خیر).
      properties:
        valid:
          type: boolean
        status:
          type: string
        receipt_number:
          type: string
        verification_code:
          type: string
        signature_hmac:
          type: string
        donor_display_name:
          type: string
        benefactor_name:
          type: string
        target_kind:
          type: string
        target_title:
          type: string
        shares_count:
          type: integer
        matched_shares_awarded:
          type: integer
        amount_rial:
          type: integer
        amount_toman:
          type: integer
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
        paid_at_jalali:
          type: string
      required:
      - amount_rial
      - amount_toman
      - benefactor_name
      - donor_display_name
      - matched_shares_awarded
      - paid_at
      - paid_at_jalali
      - receipt_number
      - shares_count
      - signature_hmac
      - status
      - target_kind
      - target_title
      - valid
      - verification_code
    ReconciliationBatch:
      type: object
      description: نمای خروجی دستهٔ مغایرت‌گیری به همراه مغایرت‌ها.
      properties:
        id:
          type: string
          format: uuid
        gateway_name:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        gateway_reported_count:
          type: integer
        matched_count:
          type: integer
        discrepancy_count:
          type: integer
        gateway_total_rial:
          type: integer
        internal_total_rial:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationItem'
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - discrepancy_count
      - gateway_name
      - gateway_reported_count
      - gateway_total_rial
      - id
      - internal_total_rial
      - items
      - matched_count
      - period_end
      - period_start
    ReconciliationItem:
      type: object
      description: نمای ردیف نتیجهٔ مغایرت‌گیری.
      properties:
        authority:
          type: string
        ref_id:
          type: string
        gateway_amount_rial:
          type: integer
        internal_amount_rial:
          type: integer
        status:
          type: string
        note:
          type: string
      required:
      - authority
      - gateway_amount_rial
      - internal_amount_rial
      - note
      - ref_id
      - status
    ReconciliationRowInputRequest:
      type: object
      description: یک ردیف از فایل تسویه درگاه پرداخت.
      properties:
        authority:
          type: string
          minLength: 1
          maxLength: 80
        ref_id:
          type: string
          default: ''
          maxLength: 80
        amount_rial:
          type: integer
          minimum: 0
      required:
      - amount_rial
      - authority
    ReconciliationRunInputRequest:
      type: object
      description: ورودی اجرای مغایرت‌گیری درگاه پرداخت.
      properties:
        gateway_name:
          type: string
          minLength: 1
          default: zarinpal
          maxLength: 32
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationRowInputRequest'
      required:
      - period_end
      - period_start
      - rows
    RefundResultOutput:
      type: object
      description: نتیجهٔ استرداد وجه همراه با سند معکوس دفترکل.
      properties:
        refund_id:
          type: string
          format: uuid
        amount_rial:
          type: integer
        status:
          type: string
      required:
      - amount_rial
      - refund_id
      - status
    ReportExportLog:
      type: object
      description: نمای تاریخچهٔ خروجی‌های اکسل صادرشده.
      properties:
        id:
          type: string
          format: uuid
        exported_by_id:
          type: string
          format: uuid
        filters: {}
        include_raw_phones:
          type: boolean
        reason:
          type: string
        file_sha256:
          type: string
        byte_size:
          type: integer
        row_counts: {}
        created_at:
          type: string
          format: date-time
      required:
      - byte_size
      - created_at
      - exported_by_id
      - file_sha256
      - filters
      - id
      - include_raw_phones
      - reason
      - row_counts
    RoleEnum:
      enum:
      - donor
      - operator
      - finance_manager
      - super_admin
      type: string
      description: |-
        * `donor` - نیکوکار (کاربر عادی)
        * `operator` - کارشناس عملیات
        * `finance_manager` - مدیر مالی و ممیزی
        * `super_admin` - مدیر ارشد سامانه
    SandboxPaymentOutput:
      type: object
      description: اطلاعات تراکنش درگاه تعاملی Sandbox جهت رندر شبیهساز پرداخت.
      properties:
        authority:
          type: string
        amount_rial:
          type: integer
        amount_toman:
          type: integer
        status:
          type: string
      required:
      - amount_rial
      - amount_toman
      - authority
      - status
    SessionItemOutput:
      type: object
      description: نمای یک نشست فعال در فهرست دستگاه‌های کاربر.
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
        network:
          type: string
        mfa_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_current:
          type: boolean
      required:
      - created_at
      - device
      - id
      - is_current
      - last_seen_at
      - mfa_verified
      - network
    SharesBreakdownOutput:
      type: object
      description: تفکیک سهام حرکت به آنلاین، مضاعفشده، آفلاین، رزروشده و باقیمانده.
      properties:
        total_shares:
          type: integer
        paid_online_shares:
          type: integer
        matched_sponsor_shares:
          type: integer
        external_offline_shares:
          type: integer
        reserved_shares:
          type: integer
        remaining_shares:
          type: integer
      required:
      - external_offline_shares
      - matched_sponsor_shares
      - paid_online_shares
      - remaining_shares
      - reserved_shares
      - total_shares
    ShortLinkResolveResponse:
      type: object
      description: پاسخ حل‌کنندهٔ پیوندک کوتاه.
      properties:
        kind:
          type: string
        short_code:
          type: string
        slug:
          type: string
        title:
          type: string
        target_path:
          type: string
        ambassador_code:
          type:
          - string
          - 'null'
      required:
      - kind
      - short_code
      - slug
      - target_path
      - title
    StaffPasswordLoginInputRequest:
      type: object
      description: ورودی ورود کارکنان با گذرواژه.
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - phone
    TargetKindEnum:
      enum:
      - campaign_shares
      - charity_jar
      type: string
      description: |-
        * `campaign_shares` - خرید سهم از حرکت خیرخواهانه
        * `charity_jar` - واریز آزاد به قلک عام خیریه
    TokenRefreshInputRequest:
      type: object
      description: ورودی نوسازی چرخشی توکن دسترسی.
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
    UrgencyLevelEnum:
      enum:
      - normal
      - urgent
      - emergency
      type: string
      description: |-
        * `normal` - عادی
        * `urgent` - فوری
        * `emergency` - اضطراری / حیاتی
    UserMeOutput:
      type: object
      description: نمای پروفایل کاربر جاری.
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        national_code_masked:
          type: string
          description: نمایش پوشاندهٔ کد ملی.
          readOnly: true
        province:
          type: string
        city:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_profile_complete:
          type: boolean
        is_staff_member:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_at_jalali:
          type:
          - string
          - 'null'
          description: تاریخ عضویت به شمسی.
          readOnly: true
      required:
      - city
      - created_at
      - created_at_jalali
      - display_name
      - first_name
      - id
      - is_profile_complete
      - is_staff_member
      - last_name
      - national_code_masked
      - phone
      - province
      - role
    UserNotification:
      type: object
      description: نمای خروجی یک اعلان کاربر.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        action_url:
          type: string
        metadata: {}
        is_read:
          type: boolean
          description: آیا اعلان خوانده شده است؟
          readOnly: true
        read_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        created_at_jalali:
          type:
          - string
          - 'null'
          description: تاریخ شمسی ثبت اعلان.
          readOnly: true
      required:
      - action_url
      - body
      - created_at
      - created_at_jalali
      - id
      - is_read
      - kind
      - metadata
      - read_at
      - title
    Problem:
      type: object
      description: بدنهٔ استاندارد خطا بر پایهٔ RFC 9457 (Problem Details for HTTP
        APIs).
      required:
      - type
      - title
      - status
      - detail
      - code
      - instance
      - trace_id
      properties:
        type:
          type: string
          format: uri
          description: نشانی پایدار مستندات این کد خطا (لنگر در ERRORS.md).
        title:
          type: string
          description: عنوان انسانخوان و قابل نمایش.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: شرح فارسی ویژهٔ نمایش به کاربر.
        code:
          type: string
          enum:
          - malformed_request
          - authentication_required
          - permission_denied
          - mfa_required
          - step_up_required
          - not_found
          - invalid_cursor
          - conflict
          - idempotency_conflict
          - idempotency_in_progress
          - resource_expired
          - validation_error
          - feature_disabled
          - rate_limited
          - service_overloaded
          - method_not_allowed
          - internal_error
          - invalid_phone
          - invalid_otp_code
          - otp_expired
          - otp_attempts_exceeded
          - otp_window_exceeded
          - invalid_mfa_code
          - mfa_locked
          - mfa_not_enrolled
          - mfa_already_enrolled
          - mfa_setup_missing
          - invalid_sheba
          - invalid_national_code
          - duplicate_national_code
          - reason_required
          - unknown_policy_key
          - cannot_revoke_current_session
          - user_inactive
          - sms_budget_exhausted
          - domain_error
          - csrf_failed
          - session_rotated
          description: کد ماشینی پایدار؛ مبنای branching در فرانتاند.
        instance:
          type: string
          description: مسیر درخواستی که خطا در آن رخ داده.
        trace_id:
          type: string
          description: همان هدر X-Request-ID؛ کلید ردیابی پشتیبانی.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: نگاشت نام فیلد (شامل مسیرهای تودرتو با نقطه) به فهرست پیامها.
        retry_after:
          type: integer
          description: ثانیههای انتظار پیش از تلاش مجدد.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: توکن دسترسی SessionAwareJWT با قابلیت ابطال آنی نشست.
    cookieAuth:
      type: apiKey
      in: cookie
      name: cf_session
      description: نشست کوکی HttpOnly هم‌مبدأ؛ در درخواست‌های نوشتنی هدر X-CSRFToken
        (طرح امنیتی csrfToken) نیز الزامی است.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: توکن CSRF دریافت‌شده از GET /api/v1/auth/csrf؛ برای تمام درخواست‌های
        نوشتنی مبتنی بر کوکی الزامی است.
  responses:
    Problem400:
      description: بدنهٔ بدشکل یا خطای پایهٔ دامنه.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem401:
      description: عدم احراز هویت، نشست باطلشده یا حساب غیرفعال.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem403:
      description: عدم مجوز، MFA الزامی یا نیاز به Step-Up تازه.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem404:
      description: منبع ناموجود یا عدم مالکیت (ضد افشای شناسه).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem405:
      description: متد HTTP پشتیبانی نمیشود.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem409:
      description: تصادم وضعیت، اتمام ظرفیت یا تعارض کلید همتوانی.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem410:
      description: انقضای رزرو، لینک یا کد یکبارمصرف.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem422:
      description: خطای اعتبارسنجی فیلدها بهصورت تجمیعی در errors.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem429:
      description: عبور از سقف نرخ درخواست؛ هدر Retry-After را بخوان.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
        Retry-After:
          description: ثانیههای انتظار پیش از تلاش مجدد.
          schema:
            type: integer
    Problem500:
      description: خطای داخلی؛ trace_id را برای پشتیبانی نگه دار.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
    Problem503:
      description: خارج از ظرفیت موقت؛ هدر Retry-After را بخوان.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-ID:
          description: شناسهٔ ردیابی درخواست برای ارجاع به پشتیبانی.
          schema:
            type: string
        Retry-After:
          description: ثانیههای انتظار پیش از تلاش مجدد.
          schema:
            type: integer
servers:
- url: https://api.charity.example.org
  description: سرور عملیاتی (جایگزین شود با آدرس واقعی استقرار)
- url: http://localhost:8000
  description: سرور توسعهٔ محلی
tags:
- name: System
  description: متادیتای بوت‌استرپ، CSRF و پروب‌های سلامت سرویس.
- name: Auth
  description: ورود OTP، ورود کارکنان، چرخش توکن و خروج از نشست.
- name: Auth - Staff MFA
  description: راه‌اندازی و تأیید دومرحله‌ای TOTP کارکنان.
- name: Donor - Profile & Sessions
  description: پروفایل خیر و مدیریت نشست‌های فعال.
- name: Donor - Notifications
  description: صندوق اعلان‌های درون‌برنامه‌ای خیر.
- name: Donor - Contributions & Checkout
  description: رزرو اتمیک سهم، قلک عام و آغاز پرداخت.
- name: Donor - Motivation Dashboard
  description: کارنامهٔ معنوی خیر، تاریخچهٔ مشارکت‌ها و اثبات مرکل شخصی.
- name: Public - Benefactors & Jars
  description: کاتالوگ عمومی خیریه‌ها (مددکاران) و قلک‌های عام.
- name: Public - Campaigns
  description: حرکت‌های سهم‌محور، دسته‌ها، رتبه‌بندی منصفانه و دیوار همراهان.
- name: Public - Express 30s Checkout
  description: مشارکت سریع مهمان در ۳۰ ثانیه بدون ثبت‌نام قبلی.
- name: Public - Payments & Receipts
  description: بازگشت درگاه، شبیه‌ساز Sandbox و استعلام اصالت رسید.
- name: Public - Cryptographic Transparency
  description: دیوار شفافیت مالی و اثبات شمول درخت مرکل RFC 6962.
- name: Public - Dedication Certificates
  description: گواهی نیت‌نامه و کارت هدیهٔ معنوی قابل اشتراک.
- name: Public - Short-Links & Ambassadors
  description: حل پیوندک و کارنامهٔ لینک‌های سفیر اجتماعی.
- name: Admin - System
  description: سلامت تفصیلی ویژهٔ تیم عملیات.
- name: Admin - Governance
  description: سیاست‌های زمان اجرا و پرچم‌های ویژگی (Feature Flags).
- name: Admin - Audit
  description: زنجیرهٔ هش تغییرناپذیر ممیزی و راستی‌آزمایی.
- name: Admin - Identity
  description: مدیریت کاربران، نقش‌ها و سیگنال‌های ریسک.
- name: Admin - Benefactors & Jars
  description: مدیریت خیریه‌ها، مددکاران و قلک‌های عام.
- name: Admin - Campaigns
  description: تعریف حرکت‌ها، حامی مضاعف و گزارش پیشرفت میدانی.
- name: Admin - Ledger & Disbursements
  description: دفتر کل دوطرفه، تسویهٔ چهارچشمی و مغایرت‌گیری بانکی.
- name: Admin - Payments & Refunds
  description: پایش پرداخت‌ها، استرداد وجه و کمک‌های خارج از درگاه.
- name: Admin - Executive Excel Reports
  description: کتابچهٔ ۸ کاربرگهٔ اکسل راست‌به‌چپ و تاریخچهٔ خروجی‌ها.
externalDocs:
  description: راهنمای یکپارچه‌سازی فرانت‌اند، کدهای خطا و کلاینت تایپ‌شده
  url: https://github.com/mohebbibrothers/Crowdfunding-Back/tree/main/docs/frontend
