# ══════════════════════════════════════════════════════════════════════════════
# Crowdfunding-Back — پیکربندی یکپارچهٔ پروژه، کیفیت کد، تایپ، امنیت و تست
# ══════════════════════════════════════════════════════════════════════════════
# اصول این فایل:
#   • یک منبع حقیقت واحد برای وابستگی‌ها، Ruff، Mypy، Pytest، Coverage و Bandit.
#   • نسخه‌های دقیق و هش‌های رمزنگاری در uv.lock قفل می‌شوند (--frozen در CI).
#   • سیاست صفر-هشدار: هر هشدار در لینت، تایپ، تست یا OpenAPI شکست ساخت است.
# ══════════════════════════════════════════════════════════════════════════════

[project]
name = "crowdfunding-back"
version = "1.5.0"
description = "سکوی هوشمند کرادفاندینگ خیریه و حرکت‌های سهم‌محور — دفتر کل دوطرفهٔ تغییرناپذیر، شفافیت درخت مرکل و معماری آمادهٔ Nitro cPanel"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crowdfunding Platform Engineering" }]
keywords = ["crowdfunding", "charity", "double-entry-ledger", "merkle-tree", "django", "iran"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django :: 6.1",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Natural Language :: Persian",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  # ── هستهٔ فریمورک، API و احراز هویت ──────────────────────────────────────
  "django>=6.0,<6.2",
  "djangorestframework>=3.15.2",
  "djangorestframework-simplejwt>=5.4.0",
  "drf-spectacular>=0.28.0",
  "django-cors-headers>=4.7.0",
  # ── داده و دارایی ایستا (سازگار با Nitro cPanel / MariaDB) ───────────────
  "mysqlclient>=2.2.7",
  "whitenoise>=6.8.2",
  # ── پیکربندی، لاگ ساخت‌یافته و مشاهده‌پذیری ──────────────────────────────
  "django-environ>=0.12.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  # ── رمزنگاری، هش رمز عبور و تولید بارکد دوبعدی ───────────────────────────
  "cryptography>=44.0.0",
  "argon2-cffi>=23.1.0",
  "segno>=1.6.1",
  # ── گزارش‌گیری مدیریتی اکسل و کلاینت HTTP درگاه/پیامک ────────────────────
  "openpyxl>=3.1.5,<3.2",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-django>=4.9.0",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.6.0",
  "factory-boy>=3.3.1",
  "hypothesis>=6.120.0",
  "freezegun>=1.5.1",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "django-stubs[compatible-mypy]>=5.1.2",
  "djangorestframework-stubs[compatible-mypy]>=3.15.2",
  "bandit[toml]>=1.8.0",
  "pip-audit>=2.8.0",
  # jsonschema ابزارِ ساخت است، نه وابستگی زمان اجرا: scripts/compile_response_samples.py
  # هر نمونهٔ پاسخ را با آن اعتبارسنجی می‌کند و test_frontend_contract.py هم
  # همان کار را در CI تکرار می‌کند. بدون آن، `make samples` و ۳۶ تست قرارداد
  # نمی‌توانند اجرا شوند — پیش از این نصب بود ولی اعلام نشده، یعنی روی یک
  # ماشین تازه `uv sync` می‌شکست.
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
server = [
  "gunicorn>=23.0.0",
  "uvicorn[standard]>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/mohebbibrothers/Crowdfunding-Back"
Documentation = "https://github.com/mohebbibrothers/Crowdfunding-Back/tree/main/docs"
Source = "https://github.com/mohebbibrothers/Crowdfunding-Back"
Issues = "https://github.com/mohebbibrothers/Crowdfunding-Back/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps", "src/config"]

[tool.uv]
package = true

# ──────────────────────────────────────────────────────────────────────────────
# Ruff — لینت و قالب‌بندی سخت‌گیرانه (صفر هشدار)
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", "staticfiles", "media", ".venv", "docs/api/v1/openapi.yaml"]

[tool.ruff.lint]
select = [
  "E", "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "DJ",
  "RUF",
  "S",
  "PTH",
  "RET",
  "ARG",
  "TID",
  "T20",
  "TRY",
  "LOG",
  "G",
  "N",
  "PLC", "PLE", "PLR", "PLW",
  "ASYNC",
  "FURB",
]
ignore = [
  "E501",
  "S101",
  "TRY003",
  "N818",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "RUF001", "RUF002", "RUF003",
  "S105", "S106",
  "PLC0415",
  "TRY300",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["ALL"]
"**/tests/**" = ["S101", "ARG", "PLR2004", "PLR0913", "PLR0917", "PLC0415", "S105", "S106"]
"**/test_*.py" = ["S101", "ARG", "PLR2004", "PLR0913", "PLR0917", "PLC0415", "S105", "S106"]
"conftest.py" = ["ARG"]
"src/manage.py" = ["TID251"]
"src/config/settings/*.py" = ["F403", "F405", "F401"]
"**/admin.py" = ["ARG002"]
"scripts/*.py" = ["T201"]
"deploy/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "از django.utils.timezone.now() استفاده کنید (آگاه به منطقهٔ زمانی)."
"datetime.datetime.now".msg = "زمان بدون منطقهٔ زمانی ممنوع است؛ از django.utils.timezone.now() استفاده کنید."
"random".msg = "استفاده از ماژول random ممنوع است؛ برای امنیت از secrets استفاده کنید."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ──────────────────────────────────────────────────────────────────────────────
# Mypy — حالت strict از گام نخست
# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["src/apps", "src/config"]
exclude = "(^|/)(migrations|tests)/"
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
warn_unused_ignores = false
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
  "structlog.*",
  "prometheus_client.*",
  "environ.*",
  "MySQLdb.*",
  "factory.*",
  "freezegun.*",
  "openpyxl",
  "openpyxl.*",
  "whitenoise.*",
  "segno.*",
  "rest_framework_simplejwt.*",
  "corsheaders.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ──────────────────────────────────────────────────────────────────────────────
# Pytest — صفر هشدار، اجرای روی MariaDB واقعی
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["src/tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--reuse-db",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:django.utils.deprecation",
]
markers = [
  "unit: تست‌های واحد بدون IO",
  "integration: تست‌های یکپارچگی با MariaDB واقعی",
  "concurrency: تست‌های هم‌زمانی تراکنش‌های موازی روی MariaDB",
  "architecture: گیت‌های انضباط معماری مبتنی بر AST",
  "contract: گیت‌های قرارداد OpenAPI، RFC 9457، محیط و مستندات",
  "property: تست‌های اثبات ریاضی مبتنی بر ویژگی (Hypothesis)",
  "chaos: تست‌های آشوب و تزریق خطای سرویس‌های بیرونی",
]

# ──────────────────────────────────────────────────────────────────────────────
# Coverage — پوشش شاخه‌ای با راتچت صعودی
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["apps", "config"]
branch = true
concurrency = ["thread"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/test_*.py",
  "*/__init__.py",
  "*manage.py",
  "*/config/asgi.py",
  "*/config/wsgi.py",
  "*/config/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_also = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "@overload",
]

# ──────────────────────────────────────────────────────────────────────────────
# Bandit — تحلیل ایستای امنیت
# ──────────────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*"]
